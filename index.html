<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — MDP Data</title>
<link rel="stylesheet" href="style.css">
<script type="text/javascript" src="https://gc.kes.v2.scr.kaspersky-labs.com/7EA5E9BB-55E1-4C31-9C21-4943DDFED2E4/main.js?attr=j1xVX3t8XyRbqI5QpJX5qDB8CCozG2UqyECB_q5G_9oQ5kjFsWF_AL5lcMm0N22aCtDWKI4heOkv7o0xRouWLBj052LEYGfpx6n3kiSnaG47rosPWgMSUYf2Na_5bXZHse-DxFa8eo_D1u-bsUU7ZUbiUTYoGaG3uf9-_dJ-4QQxAWNVAuDouDhK6O7ZatkgOpAXv16bbPIL76xJR5NYeC5AT9l9EeYe6xZ4j31kEPGJ6u2KgUqMz5CQ4-vK1CbytdGAbnN7gQ37qgFaDtSxbKjshZj8-22hPl4Plia49e4YvWYj7H57xSmXgatBaRnh" charset="UTF-8"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-mark"><span class="dot"></span><span>MDP Data</span></div>
    <h1>سجّل دخولك لعرض بياناتك</h1>

    <div class="error-msg" id="errMsg"></div>

    <form id="loginForm">
      <div class="field">
        <label>اسم المستخدم</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">دخول</button>
    </form>
  </div>
</div>

<script>
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showError(msg){
  const el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

async function routeIfLoggedIn(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session) return;
  const { data: profile } = await supabaseClient
    .from('profiles')
    .select('is_admin')
    .eq('id', session.user.id)
    .single();
  window.location.href = (profile && profile.is_admin) ? 'admin.html' : 'dashboard.html';
}
routeIfLoggedIn();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'بيتم الدخول...';
  document.getElementById('errMsg').style.display = 'none';

  const username = document.getElementById('username').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const email = username.includes('@') ? username : username + USERNAME_DOMAIN;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if(error){
    showError('اسم المستخدم أو كلمة المرور غلط.');
    btn.disabled = false; btn.textContent = 'دخول';
    return;
  }

  const { data: profile } = await supabaseClient
    .from('profiles')
    .select('is_admin')
    .eq('id', data.user.id)
    .single();

  window.location.href = (profile && profile.is_admin) ? 'admin.html' : 'dashboard.html';
});
</script>

</body>
</html>
