<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بياناتي — MDP Data</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="auth-mark"><span class="dot"></span><span>MDP Data</span></div>
    <nav>
      <a href="dashboard.html" class="active">بياناتي</a>
      <a href="profile.html">تغيير كلمة المرور</a>
    </nav>
    <div class="who" id="whoBox"></div>
    <a href="#" id="logoutLink" class="small">تسجيل الخروج</a>
  </aside>

  <main class="main">
    <h1>بياناتي</h1>
    <p class="subtitle" id="subtitlePerms">جاري التحميل...</p>

    <div class="toolbar">
      <span></span>
      <button class="btn btn-sm" id="downloadBtn" style="width:auto;">تنزيل Excel</button>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>الداتا</span>
        <span class="badge" id="countBadge">0 صف</span>
      </div>
      <div class="table-wrap" id="tableWrap">
        <div class="empty-state">جاري تحميل البيانات...</div>
      </div>
    </div>
  </main>
</div>

<script>
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let allRows = [];
let allColumns = [];

async function init(){
  const { data: { session } } = await supabase.auth.getSession();
  if(!session){ window.location.href = 'index.html'; return; }

  const { data: profile } = await supabase
    .from('profiles').select('is_admin, email, display_name').eq('id', session.user.id).single();

  if(profile && profile.is_admin){ window.location.href = 'admin.html'; return; }

  document.getElementById('whoBox').textContent = (profile && (profile.display_name || profile.email)) || session.user.email;

  const { data: perms } = await supabase
    .from('permissions').select('perm_type, value').eq('user_id', session.user.id);

  const brands = (perms || []).filter(p => p.perm_type === 'brand').map(p => p.value === '*' ? 'كل البراندات' : p.value);
  const partners = (perms || []).filter(p => p.perm_type === 'partner').map(p => p.value === '*' ? 'كل البارتنرز' : p.value);

  const parts = [];
  if(brands.length) parts.push('البراندات: ' + brands.join('، '));
  if(partners.length) parts.push('البارتنرز: ' + partners.join('، '));
  document.getElementById('subtitlePerms').textContent = parts.length
    ? parts.join(' — ')
    : 'مفيش صلاحيات متاحة لحسابك حاليًا — كلم الأدمن.';

  const { data: colsRow } = await supabase.from('data_columns').select('columns').eq('id', 1).single();
  allColumns = (colsRow && colsRow.columns) || [];

  const { data: rows, error } = await supabase
    .from('data_rows').select('row_data').order('id', { ascending: true });

  if(error){
    document.getElementById('tableWrap').innerHTML = '<div class="empty-state">حصل خطأ في تحميل البيانات.</div>';
    return;
  }

  allRows = (rows || []).map(r => r.row_data);
  if(!allColumns.length && allRows.length) allColumns = Object.keys(allRows[0]);

  renderTable(allRows);
}

function renderTable(rows){
  document.getElementById('countBadge').textContent = rows.length + ' صف';
  const wrap = document.getElementById('tableWrap');
  if(!rows.length){
    wrap.innerHTML = '<div class="empty-state">لا توجد بيانات متاحة لحسابك حاليًا.</div>';
    return;
  }
  let html = '<table><thead><tr>';
  allColumns.forEach(c => html += `<th>${escapeHtml(c)}</th>`);
  html += '</tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr>';
    allColumns.forEach(c => html += `<td>${escapeHtml(r[c] ?? '')}</td>`);
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function escapeHtml(v){
  return String(v).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  if(!allRows.length) return;
  const ws = XLSX.utils.json_to_sheet(allRows, { header: allColumns });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الداتا');
  const today = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `mdp-data-${today}.xlsx`);
});

document.getElementById('logoutLink').addEventListener('click', async (e) => {
  e.preventDefault();
  await supabase.auth.signOut();
  window.location.href = 'index.html';
});

init();
</script>

</body>
</html>
