<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بياناتي</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="config.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="auth-mark">MDP Data</div><nav><a class="active" href="dashboard.html">بياناتي</a><a href="archive.html">Achievement</a><a href="profile.html">تغيير كلمة المرور</a></nav><div class="who" id="whoBox"></div><a href="#" id="logout">تسجيل الخروج</a></aside><main class="main"><h1>بياناتي</h1><p class="subtitle" id="info">جاري التحميل...</p><button class="btn" id="downloadBtn">تنزيل Excel</button><div class="panel"><div class="panel-header">الداتا <span class="badge" id="count">0 صف</span></div><div class="table-wrap" id="tableWrap"></div></div></main></div><script>
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let rows=[],cols=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// عشان نجيب كل الصفوف مهما كان عددهم، بنطلب على دفعات (صفحات) لحد ما ترجع صفحة فاضية تمامًا —
// مش لحد ما ترجع صفحة أقل من 1000 (لأن الحد الأقصى الفعلي لكل طلب ممكن يكون مختلف).
async function fetchAllRows(B,P){
  let all=[], from=0;
  while(true){
    let {data,error}=await sb.from('data_rows').select('row_data,brand,partner')
      .in('brand',B).in('partner',P).order('id',{ascending:true})
      .range(from, from+999);
    if(error) throw error;
    if(!data || data.length===0) break;
    all=all.concat(data);
    from+=data.length;
  }
  return all;
}

async function init(){
  let {data:{session}}=await sb.auth.getSession();
  if(!session)return location='index.html';
  let {data:p}=await sb.from('profiles').select('is_admin,email,display_name').eq('id',session.user.id).single();
  if(p?.is_admin)return location='admin.html';
  whoBox.textContent=p?.display_name||p?.email||session.user.email;
  let {data:pm}=await sb.from('permissions').select('perm_type,value').eq('user_id',session.user.id);
  let B=(pm||[]).filter(x=>x.perm_type==='brand').map(x=>x.value),P=(pm||[]).filter(x=>x.perm_type==='partner').map(x=>x.value);
  info.textContent=`🏷️ ${B.length} Brands — 🤝 ${P.length} Partners — يتم عرض التقاطع بينهم مثل Excel`;
  if(!B.length||!P.length){tableWrap.innerHTML='<div class="empty-state">لا توجد صلاحيات مكتملة.</div>';return}

  let c=await sb.from('data_columns').select('columns').eq('id',1).single();
  cols=c.data?.columns||[];

  try{
    let data=await fetchAllRows(B,P);
    rows=data.map(x=>x.row_data);
  }catch(err){
    tableWrap.innerHTML='<div class="empty-state">'+esc(err.message)+'</div>';
    return;
  }

  if(!cols.length&&rows.length)cols=Object.keys(rows[0]);
  render();
}

function render(){count.textContent=rows.length+' صف';if(!rows.length){tableWrap.innerHTML='<div class="empty-state">لا توجد بيانات مطابقة.</div>';return}let h='<table><thead><tr>'+cols.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';rows.forEach(r=>h+='<tr>'+cols.map(c=>'<td>'+esc(r[c]??'')+'</td>').join('')+'</tr>');tableWrap.innerHTML=h+'</tbody></table>'}
downloadBtn.onclick=()=>{if(!rows.length)return;let ws=XLSX.utils.json_to_sheet(rows,{header:cols}),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'الداتا');XLSX.writeFile(wb,'mdp-data.xlsx')};
logout.onclick=async e=>{e.preventDefault();await sb.auth.signOut();location='index.html'};
init();
</script></body></html>
